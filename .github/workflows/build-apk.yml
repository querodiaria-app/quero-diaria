name: Gerar App Oficial Quero Diária

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'google-services.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar pasta web e instalar Capacitor
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          npm install
          npm install --no-save sharp @capacitor/assets
          npx cap add android

      - name: Gerar ícones QD oficiais arredondados (App + Notificação Android)
        run: |
          cat << 'EOF' > generate-icon.js
          const fs = require('fs');
          const sharp = require('sharp');

          const qRingPath = `M 64.0 249.9 A 104.6 104.6 0 1 0 273.2 249.9 A 104.6 104.6 0 1 0 64.0 249.9 Z M 106.1 249.9 A 62.5 62.5 0 1 0 231.1 249.9 A 62.5 62.5 0 1 0 106.1 249.9 Z`;
          const qTailPoints = `197.0,269.5 293.1,375.1 244.4,375.1 169.9,292.5`;
          const dPath = `M 276.8 150.5 H 347.2 A 100.8 100.8 0 0 1 347.2 352.1 H 276.8 Z M 317.4 189.7 H 347.2 A 61.6 61.6 0 0 1 347.2 312.8 H 317.4 Z`;

          const fullIconSvg = `
          <svg width="1024" height="1024" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <rect width="512" height="512" fill="#0a1f3a" />
            <path fill="#ffffff" fill-rule="evenodd" d="${qRingPath}" />
            <polygon fill="#ffffff" points="${qTailPoints}" />
            <path fill="#f35b04" fill-rule="evenodd" d="${dPath}" />
          </svg>`;

          const fgSvg = `
          <svg width="1024" height="1024" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(256, 256) scale(0.66) translate(-256, -256)">
              <path fill="#ffffff" fill-rule="evenodd" d="${qRingPath}" />
              <polygon fill="#ffffff" points="${qTailPoints}" />
              <path fill="#f35b04" fill-rule="evenodd" d="${dPath}" />
            </g>
          </svg>`;

          const notifSvg = `
          <svg width="256" height="256" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(256, 256) scale(1.08) translate(-256, -256)">
              <g transform="translate(-5, 0)">
                <path fill="#ffffff" fill-rule="evenodd" d="${qRingPath}" />
                <polygon fill="#ffffff" points="${qTailPoints}" />
              </g>
              <g transform="translate(5, 0)">
                <path fill="#ffffff" fill-rule="evenodd" d="${dPath}" />
              </g>
            </g>
          </svg>`;

          const bgSvg = `<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg"><rect width="1024" height="1024" fill="#0a1f3a"/></svg>`;
          const splashSvg = `<svg width="2732" height="2732" xmlns="http://www.w3.org/2000/svg"><rect width="2732" height="2732" fill="#0a1f3a"/></svg>`;

          (async () => {
            await sharp(Buffer.from(fullIconSvg)).png().toFile('assets/icon-only.png');
            await sharp(Buffer.from(fgSvg)).png().toFile('assets/icon-foreground.png');
            await sharp(Buffer.from(bgSvg)).png().toFile('assets/icon-background.png');
            await sharp(Buffer.from(splashSvg)).png().toFile('assets/splash.png');
            await sharp(Buffer.from(splashSvg)).png().toFile('assets/splash-dark.png');

            const densities = [
              ['drawable-mdpi', 24],
              ['drawable-hdpi', 36],
              ['drawable-xhdpi', 48],
              ['drawable-xxhdpi', 72],
              ['drawable-xxxhdpi', 96],
              ['drawable', 96]
            ];
            for (const [folder, size] of densities) {
              const dir = `android/app/src/main/res/${folder}`;
              fs.mkdirSync(dir, { recursive: true });
              await sharp(Buffer.from(notifSvg)).resize(size, size).png().toFile(`${dir}/ic_stat_qd.png`);
            }
          })();
          EOF
          node generate-icon.js
          npx capacitor-assets generate --android --iconBackgroundColor '#0a1f3a' --iconBackgroundColorDark '#0a1f3a' --splashBackgroundColor '#0a1f3a' --splashBackgroundColorDark '#0a1f3a'

      - name: Configurar notificações e tema corrigido
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#0f294d</item>
                  <item name="colorPrimaryDark">#09172e</item>
                  <item name="colorAccent">#f35b04</item>
                  <item name="android:statusBarColor">#09172e</item>
                  <item name="android:navigationBarColor">#ffffff</item>
                  <item name="android:windowBackground">#f1f5f9</item>
                  <item name="android:background">@null</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">@null</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="android:windowBackground">#0a1f3a</item>
                  <item name="windowSplashScreenBackground">#0a1f3a</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > patch-android.js
          const fs = require("fs");
          const colorsPath = "android/app/src/main/res/values/colors.xml";
          let colors = fs.existsSync(colorsPath)
            ? fs.readFileSync(colorsPath, "utf8")
            : '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>';
          if (!colors.includes("qd_notif_color")) {
            colors = colors.replace("</resources>", '    <color name="qd_notif_color">#f35b04</color>\n</resources>');
            fs.writeFileSync(colorsPath, colors);
          }

          const manifestPath = "android/app/src/main/AndroidManifest.xml";
          let manifest = fs.readFileSync(manifestPath, "utf8");
          if (!manifest.includes("default_notification_icon")) {
            const meta = [
              '        <meta-data',
              '            android:name="com.google.firebase.messaging.default_notification_icon"',
              '            android:resource="@drawable/ic_stat_qd" />',
              '        <meta-data',
              '            android:name="com.google.firebase.messaging.default_notification_color"',
              '            android:resource="@color/qd_notif_color" />',
              '        <meta-data',
              '            android:name="com.google.firebase.messaging.default_notification_channel_id"',
              '            android:value="vagas_channel" />'
            ].join("\n");
            manifest = manifest.replace("</application>", meta + "\n    </application>");
            fs.writeFileSync(manifestPath, manifest);
          }
          EOF
          node patch-android.js
          npx cap sync android

      - name: Configurar assinatura oficial (Release)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/quero-diaria.jks
          cat << EOF >> android/app/build.gradle

          android {
              defaultConfig {
                  versionCode ${GITHUB_RUN_NUMBER}
                  versionName "1.0.${GITHUB_RUN_NUMBER}"
              }
              signingConfigs {
                  release {
                      storeFile file("quero-diaria.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Compilar APK e AAB Oficiais
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Disponibilizar APK Oficial (WhatsApp / Direto)
        uses: actions/upload-artifact@v4
        with:
          name: QueroDiaria-APK-Oficial
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Disponibilizar AAB Oficial (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: QueroDiaria-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
