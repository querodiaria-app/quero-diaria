name: Gerar App Oficial Quero Diária

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'google-services.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar pasta web e instalar Capacitor
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          npm install
          npm install --no-save sharp @capacitor/assets
          npx cap add android

      - name: Gerar ícones QD (App + Notificação Android)
        run: |
          cat << 'EOF' > generate-icon.js
          const fs = require('fs');
          const sharp = require('sharp');

          const fullIconSvg = `
          <svg width="1024" height="1024" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <rect width="512" height="512" fill="#09172e" />
            <path fill="#ffffff" fill-rule="evenodd" d="M 176 136 C 232 136 270 182 270 246 C 270 310 232 356 176 356 C 120 356 82 310 82 246 C 82 182 120 136 176 136 Z M 176 182 C 144 182 126 208 126 246 C 126 284 144 310 176 310 C 208 310 226 284 226 246 C 226 208 208 182 176 182 Z" />
            <line x1="196" y1="274" x2="254" y2="366" stroke="#09172e" stroke-width="58" stroke-linecap="round" />
            <line x1="194" y1="272" x2="254" y2="366" stroke="#ffffff" stroke-width="44" stroke-linecap="round" />
            <path fill="#f35b04" fill-rule="evenodd" d="M 278 164 C 278 146 290 136 308 136 H 344 C 402 136 440 180 440 246 C 440 312 402 356 344 356 H 308 C 290 356 278 346 278 328 Z M 322 182 V 310 H 344 C 378 310 396 286 396 246 C 396 206 378 182 344 182 Z" />
          </svg>`;

          const fgSvg = `
          <svg width="1024" height="1024" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(256, 256) scale(0.65) translate(-256, -256)">
              <path fill="#ffffff" fill-rule="evenodd" d="M 176 136 C 232 136 270 182 270 246 C 270 310 232 356 176 356 C 120 356 82 310 82 246 C 82 182 120 136 176 136 Z M 176 182 C 144 182 126 208 126 246 C 126 284 144 310 176 310 C 208 310 226 284 226 246 C 226 208 208 182 176 182 Z" />
              <line x1="196" y1="274" x2="254" y2="366" stroke="#09172e" stroke-width="58" stroke-linecap="round" />
              <line x1="194" y1="272" x2="254" y2="366" stroke="#ffffff" stroke-width="44" stroke-linecap="round" />
              <path fill="#f35b04" fill-rule="evenodd" d="M 278 164 C 278 146 290 136 308 136 H 344 C 402 136 440 180 440 246 C 440 312 402 356 344 356 H 308 C 290 356 278 346 278 328 Z M 322 182 V 310 H 344 C 378 310 396 286 396 246 C 396 206 378 182 344 182 Z" />
            </g>
          </svg>`;

          const notifSvg = `
          <svg width="256" height="256" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(256, 256) scale(1.08) translate(-256, -256)">
              <path fill="#ffffff" fill-rule="evenodd" d="M 168 136 C 224 136 262 182 262 246 C 262 310 224 356 168 356 C 112 356 74 310 74 246 C 74 182 112 136 168 136 Z M 168 184 C 138 184 120 208 120 246 C 120 284 138 308 168 308 C 198 308 216 284 216 246 C 216 208 198 184 168 184 Z" />
              <line x1="186" y1="274" x2="246" y2="366" stroke="#ffffff" stroke-width="44" stroke-linecap="round" />
              <path fill="#ffffff" fill-rule="evenodd" d="M 284 164 C 284 146 296 136 314 136 H 348 C 406 136 444 180 444 246 C 444 312 406 356 348 356 H 314 C 296 356 284 346 284 328 Z M 328 184 V 308 H 348 C 380 308 398 286 398 246 C 398 206 380 184 348 184 Z" />
            </g>
          </svg>`;

          const bgSvg = `<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg"><rect width="1024" height="1024" fill="#09172e"/></svg>`;
          const splashSvg = `<svg width="2732" height="2732" xmlns="http://www.w3.org/2000/svg"><rect width="2732" height="2732" fill="#09172e"/></svg>`;

          (async () => {
            await sharp(Buffer.from(fullIconSvg)).png().toFile('assets/icon-only.png');
            await sharp(Buffer.from(fgSvg)).png().toFile('assets/icon-foreground.png');
            await sharp(Buffer.from(bgSvg)).png().toFile('assets/icon-background.png');
            await sharp(Buffer.from(splashSvg)).png().toFile('assets/splash.png');
            await sharp(Buffer.from(splashSvg)).png().toFile('assets/splash-dark.png');

            const densities = [
              ['drawable-mdpi', 24],
              ['drawable-hdpi', 36],
              ['drawable-xhdpi', 48],
              ['drawable-xxhdpi', 72],
              ['drawable-xxxhdpi', 96],
              ['drawable', 96]
            ];
            for (const [folder, size] of densities) {
              const dir = `android/app/src/main/res/${folder}`;
              fs.mkdirSync(dir, { recursive: true });
              await sharp(Buffer.from(notifSvg)).resize(size, size).png().toFile(`${dir}/ic_stat_qd.png`);
            }
          })();
          EOF
          node generate-icon.js
          npx capacitor-assets generate --android --iconBackgroundColor '#09172e' --iconBackgroundColorDark '#09172e' --splashBackgroundColor '#09172e' --splashBackgroundColorDark '#09172e'

      - name: Configurar notificações e tema corrigido
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#0f294d</item>
                  <item name="colorPrimaryDark">#09172e</item>
                  <item name="colorAccent">#f35b04</item>
                  <item name="android:statusBarColor">#09172e</item>
                  <item name="android:navigationBarColor">#ffffff</item>
                  <item name="android:windowBackground">#f1f5f9</item>
                  <item name="android:background">@null</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">@null</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="android:windowBackground">#09172e</item>
                  <item name="windowSplashScreenBackground">#09172e</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > patch-android.js
          const fs = require("fs");
          const colorsPath = "android/app/src/main/res/values/colors.xml";
          let colors = fs.existsSync(colorsPath)
            ? fs.readFileSync(colorsPath, "utf8")
            : '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>';
          if (!colors.includes("qd_notif_color")) {
            colors = colors.replace("</resources>", '    <color name="qd_notif_color">#f35b04</color>\n</resources>');
            fs.writeFileSync(colorsPath, colors);
          }

          const manifestPath = "android/app/src/main/AndroidManifest.xml";
          let manifest = fs.readFileSync(manifestPath, "utf8");
          if (!manifest.includes("default_notification_icon")) {
            const meta = [
              '        <meta-data',
              '            android:name="com.google.firebase.messaging.default_notification_icon"',
              '            android:resource="@drawable/ic_stat_qd" />',
              '        <meta-data',
              '            android:name="com.google.firebase.messaging.default_notification_color"',
              '            android:resource="@color/qd_notif_color" />',
              '        <meta-data',
              '            android:name="com.google.firebase.messaging.default_notification_channel_id"',
              '            android:value="vagas_channel" />'
            ].join("\n");
            manifest = manifest.replace("</application>", meta + "\n    </application>");
            fs.writeFileSync(manifestPath, manifest);
          }
          EOF
          node patch-android.js
          npx cap sync android

      - name: Configurar assinatura oficial (Release)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/quero-diaria.jks
          cat << EOF >> android/app/build.gradle

          android {
              defaultConfig {
                  versionCode ${GITHUB_RUN_NUMBER}
                  versionName "1.0.${GITHUB_RUN_NUMBER}"
              }
              signingConfigs {
                  release {
                      storeFile file("quero-diaria.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Compilar APK e AAB Oficiais
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Disponibilizar APK Oficial (WhatsApp / Direto)
        uses: actions/upload-artifact@v4
        with:
          name: QueroDiaria-APK-Oficial
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Disponibilizar AAB Oficial (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: QueroDiaria-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
